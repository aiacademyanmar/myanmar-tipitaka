name: Pali Corpus Pipeline Tests V2.3.8.2
on:
  push:
    branches: [feature/verified-pali-import-v2377]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test synthetic staging and reviewed-only export
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Confirm no full-text release claim
        run: |
          test ! -e app/src/main/assets/approved_pali.sqlite || echo "Approved asset exists; manual license/content review required."
