name: Myanmar Tipitaka V2.3.4.8.5 Offline Corpus + Import QA + APK

on:
  workflow_dispatch:
  push:
    branches:
      - v2.3.4-offline-reader-critical-fix
    paths:
      - 'app/**'
      - 'content/**'
      - 'corpus/**'
      - 'database/**'
      - 'scripts/**'
      - 'docs/V2.3.4.8_*'
      - '.github/workflows/build-v2-3-4-8.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Test reviewed Myanmar import pipeline
        run: python3 -m unittest scripts/test_merge_verified_myanmar.py -v
      - name: Verify 45-volume offline corpus and Myanmar review data
        run: python3 scripts/verify_offline_corpus.py
      - name: Import reviewed Myanmar translations and explanations (if supplied)
        run: python3 scripts/merge_verified_myanmar.py --database app/src/main/assets/tipitaka_offline.sqlite --reviewed corpus/reviewed_myanmar.csv --report myanmar_review_coverage.json
      - name: Compile debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Myanmar-Tipitaka-V2.3.4.8.5-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
