name: Myanmar Tipitaka V2.3.6.3 Native SQLite Foundation + APK

on:
  workflow_dispatch:
  push:
    branches:
      - v2.3.4-offline-reader-critical-fix
    paths:
      - 'app/**'
      - 'content/**'
      - 'corpus/**'
      - 'scripts/validate_myanmar_source_inventory.py'
      - 'database/**'
      - 'scripts/**'
      - 'docs/V2.3.4.8_*'
      - '.github/workflows/build-v2-3-4-8.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Verify standalone publisher and content overlay
        run: |
          grep -q 'class MyanmarPublisherActivity' app/src/main/java/asia/aaii/myanmartipitaka/MyanmarPublisherActivity.java
          grep -q 'class MyanmarContentStore' app/src/main/java/asia/aaii/myanmartipitaka/MyanmarContentStore.java
          grep -q 'publisher.paragraph_myanmar_content' app/src/main/java/asia/aaii/myanmartipitaka/ParagraphExplanationActivity.java
          grep -q 'publishApprovedDrafts' app/src/main/java/asia/aaii/myanmartipitaka/MyanmarPublisherActivity.java
      - name: Verify candidate export implementation
        run: grep -q 'exportReviewedCandidates' app/src/main/java/asia/aaii/myanmartipitaka/MyanmarEditorialActivity.java
      - name: Compile native Myanmar editorial screen (covered by app build)
        run: grep -q 'class MyanmarEditorialActivity' app/src/main/java/asia/aaii/myanmartipitaka/MyanmarEditorialActivity.java
      - name: Validate special-content manifests and draft coverage
        id: special_content
        continue-on-error: true
        run: python3 scripts/validate_special_content.py
      - name: Verify V2.3.6.3 offline search and SQLite QA
        run: |
          grep -q 'class OfflineDatabaseQaActivity' app/src/main/java/asia/aaii/myanmartipitaka/OfflineDatabaseQaActivity.java
          grep -q 'OfflineDatabaseQaActivity' app/src/main/AndroidManifest.xml
          grep -q 'MyanmarContentStore.DB_NAME' app/src/main/java/asia/aaii/myanmartipitaka/OfflineSearchActivity.java
          grep -q 'tipitaka-offline-search' app/src/main/java/asia/aaii/myanmartipitaka/OfflineSearchActivity.java
      - name: Verify V2.3.6.3 searchable offline library and progress
        run: |
          grep -q 'class OfflineBookLibraryActivity' app/src/main/java/asia/aaii/myanmartipitaka/OfflineBookLibraryActivity.java
          grep -q 'addTextChangedListener' app/src/main/java/asia/aaii/myanmartipitaka/OfflineBookLibraryActivity.java
          grep -q 'removeBook' app/src/main/java/asia/aaii/myanmartipitaka/OfflineBookLibraryActivity.java
          grep -q 'showProgress' app/src/main/java/asia/aaii/myanmartipitaka/BookReaderActivity.java

          grep -q 'class OfflineBookLibraryActivity' app/src/main/java/asia/aaii/myanmartipitaka/OfflineBookLibraryActivity.java
          grep -q 'OfflineBookLibraryActivity' app/src/main/AndroidManifest.xml
          grep -q 'reader_library' app/src/main/java/asia/aaii/myanmartipitaka/BookReaderActivity.java
          grep -q 'copyIntoOfflineLibrary' app/src/main/java/asia/aaii/myanmartipitaka/BookReaderActivity.java
          grep -q 'bookmarks_' app/src/main/java/asia/aaii/myanmartipitaka/BookReaderActivity.java
          grep -q 'local_path' app/src/main/java/asia/aaii/myanmartipitaka/OfflineBookLibraryActivity.java
      - name: Verify V2.3.6.3 PDF reader, bookmarks and history
        run: |
          grep -q 'class KbrlBookCatalogActivity' app/src/main/java/asia/aaii/myanmartipitaka/KbrlBookCatalogActivity.java
          grep -q 'KbrlBookCatalogActivity' app/src/main/java/asia/aaii/myanmartipitaka/ReferenceLibraryActivity.java
          grep -q 'saveCurrentBookmark' app/src/main/java/asia/aaii/myanmartipitaka/OnlineBookReaderActivity.java
          grep -q 'showEntries("history","Reading History")' app/src/main/java/asia/aaii/myanmartipitaka/OnlineBookReaderActivity.java
          grep -q 'isPdfUrl' app/src/main/java/asia/aaii/myanmartipitaka/OnlineBookReaderActivity.java
          grep -q 'android.net.http.SslError' app/src/main/java/asia/aaii/myanmartipitaka/OnlineBookReaderActivity.java
      - name: Verify V2.3.6.3 KBRL catalog and WebView reader
        run: |
          grep -q 'class KbrlBookCatalogActivity' app/src/main/java/asia/aaii/myanmartipitaka/KbrlBookCatalogActivity.java
          grep -q 'kbrl_reference_books.json' app/src/main/java/asia/aaii/myanmartipitaka/KbrlBookCatalogActivity.java
          grep -q 'android.net.http.SslError' app/src/main/java/asia/aaii/myanmartipitaka/OnlineBookReaderActivity.java
          grep -q 'class OnlineBookReaderActivity' app/src/main/java/asia/aaii/myanmartipitaka/OnlineBookReaderActivity.java
          grep -q 'KbrlBookCatalogActivity' app/src/main/AndroidManifest.xml
      - name: Verify in-app online reader integration
        run: |
          grep -q 'class OnlineBookReaderActivity' app/src/main/java/asia/aaii/myanmartipitaka/OnlineBookReaderActivity.java
          grep -q 'OnlineBookReaderActivity' app/src/main/AndroidManifest.xml
          grep -q 'uses-permission android:name="android.permission.INTERNET"' app/src/main/AndroidManifest.xml
          grep -q 'new Intent(this,OnlineBookReaderActivity.class)' app/src/main/java/asia/aaii/myanmartipitaka/ReferenceLibraryActivity.java
      - name: Verify online reference library screen
        run: |
          grep -q 'class ReferenceLibraryActivity' app/src/main/java/asia/aaii/myanmartipitaka/ReferenceLibraryActivity.java
          grep -q 'ReferenceLibraryActivity' app/src/main/AndroidManifest.xml
          grep -q 'ReferenceLibraryActivity' app/src/main/java/asia/aaii/myanmartipitaka/NativeFrontPagesActivity.java
      - name: Validate V2.3.6.3 Myanmar source inventory
        run: python3 scripts/validate_myanmar_source_inventory.py
      - name: Test 45-volume editorial batch planner
        run: python3 -m unittest scripts/test_myanmar_editorial_batches.py -v
      - name: Generate 45-volume Myanmar editorial intake plan (fail closed)
        if: always()
        run: python3 scripts/build_myanmar_editorial_batches.py --manifest corpus/45_volume_editorial_manifest.csv --report corpus/myanmar_editorial_batch_plan.json
      - name: Test reviewed Myanmar import pipeline
        id: importer_tests
        run: python3 -m unittest scripts/test_merge_verified_myanmar.py -v
      - name: Generate source acquisition catalog
        run: python3 scripts/prepare_myanmar_source_catalog.py
      - name: Verify project progress UI
        run: |
          grep -q 'ProjectProgressActivity' app/src/main/AndroidManifest.xml
          grep -q 'SourceAcquisitionActivity' app/src/main/AndroidManifest.xml
          grep -q 'class ProjectProgressActivity' app/src/main/java/asia/aaii/myanmartipitaka/ProjectProgressActivity.java
      - name: Test complete offline release audit
        run: python3 -m unittest scripts/test_full_offline_release.py -v
      - name: Verify 45-volume offline corpus and Myanmar review data
        id: corpus_gate
        continue-on-error: true
        run: python3 scripts/verify_offline_corpus.py
      - name: Validate editorial 45-volume crosswalk
        id: crosswalk_gate
        continue-on-error: true
        run: python3 scripts/validate_45_volume_crosswalk.py
      - name: Audit reviewed Myanmar editorial batch (read-only)
        id: myanmar_batch
        if: steps.corpus_gate.outcome == 'success' && steps.crosswalk_gate.outcome == 'success'
        run: python3 scripts/audit_myanmar_editorial_batch.py --database app/src/main/assets/tipitaka_offline.sqlite --reviewed corpus/reviewed_myanmar.csv --report corpus/myanmar_editorial_batch_audit.json
      - name: Import reviewed Myanmar translations and explanations (if supplied)
        if: steps.corpus_gate.outcome == 'success' && steps.crosswalk_gate.outcome == 'success' && steps.myanmar_batch.outcome == 'success'
        run: python3 scripts/merge_verified_myanmar.py --database app/src/main/assets/tipitaka_offline.sqlite --reviewed corpus/reviewed_myanmar.csv --report myanmar_review_coverage.json
      - name: Audit full Pali and Myanmar content release
        id: full_release
        continue-on-error: true
        run: python3 scripts/audit_full_offline_release.py --report corpus/full_offline_release_audit.json
      - name: Report approved Myanmar coverage by volume
        if: always()
        run: python3 scripts/report_myanmar_content_coverage.py --database app/src/main/assets/tipitaka_offline.sqlite --output corpus/myanmar_content_coverage.json
      - name: Compile debug APK (compile smoke test even when corpus is incomplete)
        if: always() && steps.importer_tests.outcome == 'success'
        run: gradle --no-daemon assembleDebug
      - name: Upload corpus verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Myanmar-Tipitaka-V2.3.6.3-Corpus-QA-Reports
          path: |
            corpus/offline_corpus_audit.json
            corpus/myanmar_editorial_batch_audit.json
            corpus/myanmar_content_coverage.json
            corpus/full_offline_release_audit.json
            corpus/verified_source_acquisition_report.json
            corpus/45_volume_editorial_manifest.csv
            corpus/myanmar_editorial_batch_plan.json
            myanmar_review_coverage.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload preview APK (compile-verified; corpus may be incomplete)
        if: always() && steps.importer_tests.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Myanmar-Tipitaka-V2.3.6.3-PREVIEW-APK-NOT-FINAL-OFFLINE
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload final offline APK (only when corpus and crosswalk pass)
        if: steps.corpus_gate.outcome == 'success' && steps.crosswalk_gate.outcome == 'success' && steps.full_release.outcome == 'success' && steps.myanmar_batch.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Myanmar-Tipitaka-V2.3.6.3-FINAL-OFFLINE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
