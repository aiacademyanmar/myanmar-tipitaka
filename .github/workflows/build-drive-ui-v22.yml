name: Build Myanmar Tipitaka V2.2 — 20 Drive UI Screens APK
on:
  workflow_dispatch:
  push:
    branches: [v2.2-exact-20-screens]
    paths:
      - 'scripts/import_drive_ui.py'
      - 'app/**'
      - '.github/workflows/build-drive-ui-v22.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install UI image importer
        run: python -m pip install 'Pillow>=10,<12' 'gdown>=5,<6'
      - name: Download and validate all 20 supplied Google Drive images
        run: python scripts/import_drive_ui.py
      - name: Import approved offline corpus if supplied
        run: |
          python scripts/import_reviewed_corpus.py
          python scripts/check_offline_coverage.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify signed APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Myanmar-Tipitaka-V2.2-20-Drive-UI-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            exact_assets_manifest.json
          if-no-files-found: error
