name: Build Offline Pali Source APK (License-Gated)
on:
  push:
    branches: [v2.2-exact-20-screens, v2.3-myanmar-review-integration]
    paths:
      - '.github/workflows/build-offline-pali-source-apk.yml'
      - 'app/src/main/java/asia/aaii/myanmartipitaka/PaliSourceLibraryActivity.java'
      - 'corpus/PALI_ORIGINAL_SOURCE_LICENSE.md'
      - 'scripts/build_offline_45_volumes.py'
      - 'scripts/merge_verified_myanmar.py'
      - 'scripts/test_merge_verified_myanmar.py'
      - 'scripts/import_tipitakaonline_cst.py'
      - 'corpus/reviewed_myanmar.csv'
      - 'app/src/main/java/asia/aaii/myanmartipitaka/ParagraphExplanationActivity.java'
      - 'app/src/main/java/asia/aaii/myanmartipitaka/OfflineSearchActivity.java'
      - 'app/src/main/java/asia/aaii/myanmartipitaka/MyanmarCoverageActivity.java'
      - 'app/src/main/java/asia/aaii/myanmartipitaka/PaliReferenceActivity.java'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/java/asia/aaii/myanmartipitaka/NativeFrontPagesActivity.java'
      - 'scripts/test_offline_45_boundaries.py'
      - 'scripts/build_dhammapada_yamakavagga.py'
      - 'scripts/build_dhammapada_423.py'
      - 'scripts/build_mangala_sutta.py'
      - 'corpus/mangala_sutta_38_my_drafts.json'
      - 'corpus/mangala_sutta_38_my_drafts.csv'
      - 'app/src/main/java/asia/aaii/myanmartipitaka/MangalaSuttaActivity.java'
      - 'corpus/dhammapada_yamakavagga_my_drafts.csv'
      - 'corpus/dhammapada_draft_21_99.csv'
      - 'corpus/dhammapada_draft_100_145.csv'
      - 'corpus/dhammapada_draft_146_196.csv'
      - 'corpus/dhammapada_draft_197_234.csv'
      - 'corpus/dhammapada_draft_235_305.csv'
      - 'corpus/dhammapada_draft_306_359.csv'
      - 'corpus/dhammapada_draft_360_423.csv'
      - 'app/src/main/java/asia/aaii/myanmartipitaka/DhammapadaYamakavaggaActivity.java'
      - 'scripts/import_drive_ui.py'
      - 'scripts/compare_mcu_exact_45.py'
      - 'corpus/mcu_reference/**'
      - 'app/src/main/java/asia/aaii/myanmartipitaka/TipitakaLibraryActivity.java'
      - 'app/src/main/java/asia/aaii/myanmartipitaka/OfflineCorpusInstaller.java'
  workflow_dispatch:
    inputs:
      rights_confirmed:
        description: 'I verified redistribution rights for the Bilara Pali source and permit bundling in this APK'
        type: boolean
        required: true
        default: false
jobs:
  build:
    if: ${{ github.event_name == 'push' || inputs.rights_confirmed == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit source rights and provenance
        run: test -s corpus/PALI_ORIGINAL_SOURCE_LICENSE.md
      - name: Retrieve upstream Pali originals
        run: |
          git clone --depth 1 --branch published --filter=blob:none --sparse https://github.com/suttacentral/bilara-data.git upstream-bilara
          cd upstream-bilara
          git sparse-checkout set root/pli/ms
          git rev-parse HEAD > ../bilara_source_commit.txt
      - name: Embed original Pali source database with provenance
        run: |
          mkdir -p app/src/main/assets
          python scripts/build_bilara_source_sqlite.py upstream-bilara/root/pli/ms --output app/src/main/assets/pali_root_source.sqlite --source-commit "$(cat bilara_source_commit.txt)"
          python - <<'PY'
          import sqlite3
          path="app/src/main/assets/pali_root_source.sqlite"
          with sqlite3.connect(path) as db:
            count=db.execute("SELECT count(*) FROM source_segments").fetchone()[0]
            assert count>400000, f"Unexpectedly incomplete corpus: {count}"
            print(f"Offline original Pali segments in APK asset: {count}")
          PY
      - name: Verify individual canonical mapping boundaries
        run: python scripts/test_offline_45_boundaries.py
      - name: Create original-Pali 45-volume offline SQLite
        run: |
          python scripts/build_offline_45_volumes.py upstream-bilara/root/pli/ms --output app/src/main/assets/tipitaka_offline.sqlite --source-commit "$(cat bilara_source_commit.txt)" --report offline_45_volume_mapping_report.json
          python - <<'PY'
          import json,sqlite3
          r=json.load(open('offline_45_volume_mapping_report.json'))
          assert r['volumes_with_source_text']==45,r
          with sqlite3.connect('app/src/main/assets/tipitaka_offline.sqlite') as db:
            assert db.execute('SELECT COUNT(DISTINCT volume) FROM paragraphs').fetchone()[0]==45
            assert db.execute('SELECT COUNT(*) FROM paragraphs').fetchone()[0]>100000
          PY
      - name: Build Dhammapada Yamakavagga offline Pali and unreviewed Myanmar draft popup
        run: |
          python scripts/build_dhammapada_yamakavagga.py
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect('app/src/main/assets/tipitaka_offline.sqlite')
          rows=db.execute("SELECT verse,pali_text,my_draft,translation_status FROM dhammapada_yamakavagga").fetchall()
          assert len(rows)==20 and all(p and m and s=='ai_draft_unreviewed' for _,p,m,s in rows)
          print("Yamakavagga 20 Pali verses and 20 unreviewed Myanmar drafts verified")
          PY
      - name: Build full 423-verse Dhammapada offline chapter index
        run: |
          python scripts/build_dhammapada_423.py
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect('app/src/main/assets/tipitaka_offline.sqlite')
          verses,chapters=db.execute("SELECT COUNT(*),COUNT(DISTINCT chapter) FROM dhammapada_verses").fetchone()
          assert verses==423 and chapters==26
          assert db.execute("SELECT COUNT(*) FROM dhammapada_verses WHERE my_draft IS NOT NULL").fetchone()[0]==423
          PY
      - name: Build standalone offline Mangala Sutta book (38 blessings)
        run: |
          python scripts/build_mangala_sutta.py
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect('app/src/main/assets/tipitaka_offline.sqlite')
          assert db.execute('SELECT COUNT(*) FROM mangala_blessings').fetchone()[0]==38
          assert db.execute('SELECT COUNT(*) FROM mangala_pali_stanzas').fetchone()[0]==13
          assert db.execute("SELECT COUNT(*) FROM mangala_blessings WHERE translation_status='ai_draft_unreviewed'").fetchone()[0]==38
          assert db.execute('SELECT COUNT(DISTINCT group_no) FROM mangala_blessings').fetchone()[0]==10
          assert db.execute("SELECT COUNT(*) FROM mangala_blessings b LEFT JOIN mangala_pali_stanzas p ON p.stanza=CAST(b.stanza_ref AS INTEGER) WHERE p.stanza IS NULL OR LENGTH(TRIM(p.pali_text))=0").fetchone()[0]==0
          print('Mangala Sutta offline verification: 38 blessings / 10 groups / 13 Pali stanzas')
          PY
      - name: Import Tipitaka Online CST source passages, references and clearly-labelled AI translations
        run: python scripts/import_tipitakaonline_cst.py --database app/src/main/assets/tipitaka_offline.sqlite --max-pages 1800 --report tipitakaonline_cst_import_report.json
      - name: Test reviewed Myanmar importer safeguards
        run: python -m unittest scripts/test_merge_verified_myanmar.py -v
      - name: Import only independently reviewed Myanmar content
        run: python scripts/merge_verified_myanmar.py --report myanmar_review_coverage.json
      - name: MCU 45-volume edition comparison (never fake verification)
        run: python scripts/compare_mcu_exact_45.py --out mcu_45_exact_comparison.json
      - name: Install UI image importer
        run: python -m pip install 'Pillow>=10,<12' 'gdown>=5,<6'
      - name: Import original 20 UI screens
        run: python scripts/import_drive_ui.py
      - name: Existing reviewed 45-volume corpus if supplied
        run: |
          python scripts/import_reviewed_corpus.py
          python scripts/check_offline_coverage.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile offline Pali APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK and embedded real corpus
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/pali_root_source.sqlite'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Myanmar-Tipitaka-45-Offline-Pali-Reader-APK-Edition-Provisional
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            bilara_source_commit.txt
            corpus/PALI_ORIGINAL_SOURCE_LICENSE.md
            offline_coverage_report.json
            offline_45_volume_mapping_report.json
            myanmar_review_coverage.json
            mcu_45_exact_comparison.json
            tipitakaonline_cst_import_report.json
          if-no-files-found: error
