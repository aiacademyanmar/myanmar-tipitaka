name: Build Myanmar Tipitaka V2.3.7.7 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'data/tipitaka_seed.sqlite.gz.b64'
      - '.github/workflows/build-myanmar-tipitaka-v2377.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Offline SQLite asset
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          base64 -d data/tipitaka_seed.sqlite.gz.b64 | gzip -d > app/src/main/assets/tipitaka_verified_seed.sqlite
          python3 - <<'PY'
          import sqlite3
          con=sqlite3.connect('app/src/main/assets/tipitaka_verified_seed.sqlite')
          assert con.execute('select count(*) from volumes').fetchone()[0] == 45
          print('Verified offline catalog 45/45. Canonical verses and approved translations are not bundled.')
          con.close()
          PY
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK signature and SQLite asset
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/tipitaka_verified_seed.sqlite'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Myanmar-Tipitaka-V2.3.7.7-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error