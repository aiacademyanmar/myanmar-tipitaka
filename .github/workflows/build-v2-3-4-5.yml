name: Build Myanmar Tipitaka V2.3.4.5 APK

on:
  workflow_dispatch:
  push:
    branches:
      - v2.3.4-offline-reader-critical-fix
    paths:
      - 'app/**'
      - 'content/**'
      - '.github/workflows/build-v2-3-4-5.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Myanmar-Tipitaka-V2.3.4.5-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
