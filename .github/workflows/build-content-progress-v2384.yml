name: Myanmar Tipitaka V2.3.8.4 - Bundled Pali + MCU45 Catalog APK
on:
  workflow_dispatch:
  push:
    branches:
      - v2.3.8.4-content-progress
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
      - name: Fetch Pali source (published)
        run: |
          git clone --depth 1 --branch published --filter=blob:none --sparse https://github.com/suttacentral/bilara-data.git upstream
          git -C upstream sparse-checkout set root/pli/ms html/pli/ms translation/my/myteam
          git -C upstream rev-parse HEAD > source_commit.txt
          cp upstream/LICENSE.md upstream_LICENSE.md
      - name: Generate Pali SQLite
        run: |
          python3 scripts/build_bilara_source_sqlite.py upstream/root/pli/ms --output pali_root_source.sqlite --source-commit "$(cat source_commit.txt)"
          mkdir -p app/src/main/assets
          python3 scripts/import_published_myanmar.py pali_root_source.sqlite upstream/translation/my/myteam --source-commit "$(cat source_commit.txt)" --report myanmar_import_report.json
          python3 scripts/build_pali_headings.py pali_root_source.sqlite upstream/root/pli/ms upstream/html/pli/ms --report pali_headings_qa.json
          cp pali_root_source.sqlite app/src/main/assets/pali_root_source.sqlite
          cp upstream_LICENSE.md app/src/main/assets/upstream_LICENSE.md
          cp source_commit.txt app/src/main/assets/pali_source_commit.txt
      - name: Generate 45-volume MCU index and validate boundaries
        run: |
          base64 -d data/tipitaka_seed.sqlite.gz.b64 | gzip -d > app/src/main/assets/mcu45_metadata.sqlite
          python3 - <<'PY'
          import sqlite3,hashlib,json,os
          p='app/src/main/assets/mcu45_metadata.sqlite'
          c=sqlite3.connect(p)
          assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          a=c.execute("SELECT pitaka,count(*) FROM volumes WHERE edition='TH_MCU_45' GROUP BY pitaka").fetchall()
          assert dict(a)=={'Vinaya':8,'Sutta':25,'Abhidhamma':12},a
          assert c.execute("SELECT count(*) FROM segments").fetchone()[0]==0
          assert c.execute("SELECT count(*) FROM entries WHERE status='approved'").fetchone()[0]==0
          c.close()
          p='pali_root_source.sqlite'
          c=sqlite3.connect(p)
          assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          n=c.execute('SELECT count(*) FROM source_segments').fetchone()[0]
          files=c.execute('SELECT count(DISTINCT source_file) FROM source_segments').fetchone()[0]
          assert n>400000 and files>7000,(n,files)
          c.close()
          report={'status':'PALI_AND_MCU45_CATALOG_PREVIEW','pali_source_segments':n,'pali_files':files,
          'mcu_volume_catalog':45,'mcu_45_verified_paragraph_boundaries':0,
          'approved_myanmar_translations':0,'approved_myanmar_explanations':0,
          'not_final_45_book_full_translation':True,
          'pali_source_commit':open('source_commit.txt').read().strip()}
          open('content_coverage_report.json','w').write(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False))
          PY
      - name: Verify Complete Bilara Vinaya Source Coverage
        run: |
          python3 - <<'PY'
          import sqlite3,json
          db=sqlite3.connect("pali_root_source.sqlite")
          rows=db.execute("SELECT source_file,count(*) FROM source_segments WHERE source_file LIKE 'vinaya/%' GROUP BY source_file").fetchall()
          def section(f):
            for i,p in enumerate(("vinaya/pli-tv-bu-pm_","vinaya/pli-tv-bi-pm_","vinaya/pli-tv-bu-vb/","vinaya/pli-tv-bi-vb/","vinaya/pli-tv-kd/","vinaya/pli-tv-pvr/")):
              if f.startswith(p):return i
            raise AssertionError("Unexpected Vinaya file: "+f)
          files=[0]*6;paras=[0]*6
          for path,count in rows:
            i=section(path);files[i]+=1;paras[i]+=count
          assert all(files),(files,paras)
          total=sum(paras)
          assert total>0
          result={"vinaya_source_files":sum(files),"vinaya_source_segments":total,"group_file_counts":files,"group_segment_counts":paras,"pali_offline":True,"mcu_eight_volume_exact_crosswalk_verified":False,"vinaya_myanmar_full_translation":False}
          open("vinaya_offline_qa.json","w").write(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result))
          db.close()
          PY
      - name: Verify full offline three-pitaka corpus and 45-volume index
        run: |
          python3 - <<'PY'
          import json, sqlite3
          p=sqlite3.connect("pali_root_source.sqlite")
          all_rows=p.execute("SELECT count(*) FROM source_segments").fetchone()[0]
          per={}
          for basket in ("vinaya","sutta","abhidhamma"):
              n=p.execute("SELECT count(*) FROM source_segments WHERE source_file LIKE ?",(basket+"/%",)).fetchone()[0]
              files=p.execute("SELECT count(DISTINCT source_file) FROM source_segments WHERE source_file LIKE ?",(basket+"/%",)).fetchone()[0]
              assert n>0 and files>0, (basket,n,files)
              per[basket]={"segments":n,"source_files":files}
          assert sum(x["segments"] for x in per.values())==all_rows, "some source segments not in the three pitakas"
          assert per["vinaya"]["segments"]>=71585,per["vinaya"]
          assert all_rows>=444701,all_rows
          assert p.execute("SELECT count(*) FROM pali_segment_titles").fetchone()[0]==all_rows
          assert p.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          p.close()
          m=sqlite3.connect("app/src/main/assets/mcu45_metadata.sqlite")
          groups=dict(m.execute("SELECT pitaka,count(*) FROM volumes WHERE edition='TH_MCU_45' GROUP BY pitaka").fetchall())
          assert groups=={"Vinaya":8,"Sutta":25,"Abhidhamma":12},groups
          assert m.execute("SELECT count(DISTINCT volume_number) FROM volumes WHERE edition='TH_MCU_45'").fetchone()[0]==45
          m.close()
          result={"offline_pali_source":True,"total_pali_segments":all_rows,"pitakas":per,
                  "MCU_volume_catalog":groups,"catalog_volume_entries":45,
                  "pali_headings_count":all_rows,"MCU_exact_paragraph_mapping_verified":False,
                  "all_45_MCU_volumes_precisely_mapped":False,
                  "full_Myanmar_translation":False,
                  "full_Myanmar_explanation":False,
                  "navigation":"volume -> appropriate basket source; not a volume-specific exact match"}
          open("all_pitakas_offline_qa.json","w").write(json.dumps(result,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(result,ensure_ascii=False))
          PY
      - name: Compile Native APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify packaged offline databases and signing
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/pali_root_source.sqlite'
          unzip -l "$APK" | grep -q 'assets/mcu45_metadata.sqlite'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - name: Upload Preview Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Myanmar-Tipitaka-V2.3.8.4-PALI-MCU45-INDEX-PREVIEW-NOT-FINAL
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            content_coverage_report.json
            myanmar_import_report.json
            vinaya_offline_qa.json
            pali_headings_qa.json
            all_pitakas_offline_qa.json
            myanmar_import_report.json
            source_commit.txt
            upstream_LICENSE.md
          if-no-files-found: error
          retention-days: 30
